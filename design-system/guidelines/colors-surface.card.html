<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces & Text" subtitle="Base, surface, borders, text hierarchy" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:150px;font-family:var(--font-body);gap:12px;padding:4px;background:var(--bg-base)">
<div style="flex:1;background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-md);padding:14px;display:flex;flex-direction:column;gap:4px">
<div style="font-size:15px;font-weight:600;color:var(--text-primary)">Primary text</div>
<div style="font-size:13px;color:var(--text-secondary)">Secondary text</div>
<div style="font-size:12px;color:var(--text-tertiary)">Tertiary text</div>
<a href="#" style="font-size:12px;color:var(--text-link)">Link text</a>
</div>
<div style="flex:1;background:var(--bg-surface-sunken);border-radius:var(--radius-md);padding:14px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-secondary)">sunken surface</div>
<div style="flex:1;background:var(--bg-inverse);border-radius:var(--radius-md);padding:14px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff">inverse surface</div>
</div>
