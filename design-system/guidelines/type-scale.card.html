<!-- @dsCard group="Type" viewport="700x260" name="Type Scale" subtitle="Plus Jakarta Sans — display through caption" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:260px;background:var(--bg-surface);font-family:var(--font-display);padding:12px;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden">
<div style="font-size:var(--fs-display-lg);font-weight:var(--fw-extrabold);color:var(--text-primary);line-height:var(--lh-tight)">Display Large 40</div>
<div style="font-size:var(--fs-h1);font-weight:var(--fw-bold);color:var(--text-primary)">Heading 1 28</div>
<div style="font-size:var(--fs-h2);font-weight:var(--fw-semibold);color:var(--text-primary)">Heading 2 24</div>
<div style="font-size:var(--fs-h3);font-weight:var(--fw-semibold);color:var(--text-primary)">Heading 3 20</div>
<div style="font-size:var(--fs-body-lg);font-weight:var(--fw-regular);color:var(--text-primary)">Body large 17 — Kamu tidak sendirian.</div>
<div style="font-size:var(--fs-body);font-weight:var(--fw-regular);color:var(--text-secondary)">Body 15 — the default paragraph size across Sahari.</div>
<div style="font-size:var(--fs-caption);font-weight:var(--fw-medium);color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.04em">Caption 12 uppercase label</div>
</div>
