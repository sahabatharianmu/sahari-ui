<!-- @dsCard group="Colors" viewport="700x220" name="Light / Dark Theme" subtitle="Set data-theme=\"dark\" on any ancestor to switch" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:220px;font-family:var(--font-body)">
<div style="flex:1;background:var(--bg-base);padding:18px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:11px;color:var(--text-tertiary);font-weight:600">LIGHT</div>
<div style="background:var(--neu-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-neu-raised-sm);padding:14px;color:var(--text-primary);font-size:14px">Kartu contoh</div>
<div style="display:flex;gap:8px">
<span style="padding:8px 16px;border-radius:var(--radius-pill);background:linear-gradient(145deg,var(--purple-400),var(--purple-600));color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow-neu-brand)">Tombol</span>
<span style="padding:8px 16px;border-radius:var(--radius-pill);background:var(--state-success-bg);color:var(--state-success-fg);font-size:13px;font-weight:600">Berhasil</span>
</div>
<div style="color:var(--text-secondary);font-size:13px">Teks sekunder di atas latar terang.</div>
</div>
<div data-theme="dark" style="flex:1;background:var(--bg-base);padding:18px;display:flex;flex-direction:column;gap:10px">
<div style="font-size:11px;color:var(--text-tertiary);font-weight:600">DARK</div>
<div style="background:var(--neu-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-neu-raised-sm);padding:14px;color:var(--text-primary);font-size:14px">Kartu contoh</div>
<div style="display:flex;gap:8px">
<span style="padding:8px 16px;border-radius:var(--radius-pill);background:linear-gradient(145deg,var(--purple-400),var(--purple-600));color:#fff;font-size:13px;font-weight:600;box-shadow:var(--shadow-neu-brand)">Tombol</span>
<span style="padding:8px 16px;border-radius:var(--radius-pill);background:var(--state-success-bg);color:var(--state-success-fg);font-size:13px;font-weight:600">Berhasil</span>
</div>
<div style="color:var(--text-secondary);font-size:13px">Teks sekunder di atas latar gelap.</div>
</div>
</div>
