<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning, danger, info — kept muted, never alarming" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:150px;font-family:var(--font-body);padding:4px">
<div style="flex:1;border-radius:var(--radius-md);background:var(--state-success-bg);color:var(--state-success-fg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:13px;font-weight:600">Success<span style="width:14px;height:14px;border-radius:50%;background:var(--state-success-solid)"></span></div>
<div style="flex:1;border-radius:var(--radius-md);background:var(--state-warning-bg);color:var(--state-warning-fg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:13px;font-weight:600">Warning<span style="width:14px;height:14px;border-radius:50%;background:var(--state-warning-solid)"></span></div>
<div style="flex:1;border-radius:var(--radius-md);background:var(--state-danger-bg);color:var(--state-danger-fg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:13px;font-weight:600">Danger<span style="width:14px;height:14px;border-radius:50%;background:var(--state-danger-solid)"></span></div>
<div style="flex:1;border-radius:var(--radius-md);background:var(--state-info-bg);color:var(--state-info-fg);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;font-size:13px;font-weight:600">Info<span style="width:14px;height:14px;border-radius:50%;background:var(--sky-500)"></span></div>
</div>
