<!-- @dsCard group="App" viewport="390x700" name="Sahari Mobile App" subtitle="Feed · Discover · Booking · Messages · Notifications" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>*{box-sizing:border-box;margin:0}body{background:var(--neu-surface)}</style>
</head><body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="Feed.jsx"></script>
<script type="text/babel" src="Discover.jsx"></script>
<script type="text/babel" src="Booking.jsx"></script>
<script type="text/babel" src="Messages.jsx"></script>
<script type="text/babel" src="Notifications.jsx"></script>
<script type="text/babel">
const ds = window.SahariDesignSystem_9526ae;
const { BottomNav, Avatar, IconButton, Card, Switch } = ds;

function Profile() {
  const [pushOn, setPushOn] = React.useState(true);
  const [privateOn, setPrivateOn] = React.useState(false);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
      <Card style={{ display: "flex", gap: 12, alignItems: "center" }}>
        <Avatar name="Dewi Lestari" size="lg" />
        <div>
          <div style={{ fontWeight: 700, color: "var(--text-primary)" }}>Dewi Lestari</div>
          <div style={{ fontSize: 13, color: "var(--text-secondary)" }}>Bergabung sejak Jan 2025</div>
        </div>
      </Card>
      <Card>
        <div style={{ fontWeight: 700, marginBottom: 12, color: "var(--text-primary)" }}>Pengaturan</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}><span style={{ fontSize: 14, color: "var(--text-primary)" }}>Notifikasi push</span><Switch checked={pushOn} onChange={setPushOn} /></div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}><span style={{ fontSize: 14, color: "var(--text-primary)" }}>Mode privat (anonim di feed)</span><Switch checked={privateOn} onChange={setPrivateOn} /></div>
        </div>
      </Card>
      <div style={{ fontSize: 12, color: "var(--text-tertiary)", lineHeight: 1.6 }}>Data kesehatan mentalmu dienkripsi dan tidak pernah dibagikan tanpa izinmu. <a href="#" style={{color:"var(--text-link)"}}>Pelajari privasi</a>.</div>
    </div>
  );
}

function App() {
  const [tab, setTab] = React.useState("home");
  const [selectedPsych, setSelectedPsych] = React.useState(null);

  const titles = { home: "Beranda", discover: "Temukan Psikolog", bookings: "Booking", messages: "Pesan", profile: "Profil" };

  return (
    <div style={{ maxWidth: 390, margin: "0 auto", minHeight: 700, display: "flex", flexDirection: "column", background: "var(--neu-surface)", fontFamily: "var(--font-body)" }}>
      <div style={{ padding: "18px 18px 10px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontFamily: "var(--font-display)", fontWeight: 800, fontSize: 20, color: "var(--purple-700)" }}>{tab === "bookings" && selectedPsych ? "" : titles[tab]}</span>
        <div style={{ display: "flex", gap: 6 }}>
          <IconButton icon={<span aria-hidden="true" style={{ fontSize: 15, fontWeight: 700 }}>N</span>} aria-label="Notifikasi" onClick={() => setTab("notifications")} />
        </div>
      </div>
      <div style={{ flex: 1, padding: "0 18px 18px", overflowY: "auto" }}>
        {tab === "home" && <Feed ds={ds} />}
        {tab === "discover" && <Discover ds={ds} onSelect={(p) => { setSelectedPsych(p); setTab("bookings"); }} />}
        {tab === "bookings" && <Booking ds={ds} psychologist={selectedPsych} onBack={() => setTab("discover")} onDone={() => { setTab("home"); setSelectedPsych(null); }} />}
        {tab === "messages" && <Messages ds={ds} />}
        {tab === "notifications" && <Notifications ds={ds} />}
        {tab === "profile" && <Profile />}
      </div>
      <BottomNav active={tab} onChange={(v) => { setTab(v); if (v !== "bookings") setSelectedPsych(null); }} items={[
        { value: "home", label: "Beranda" },
        { value: "discover", label: "Temukan" },
        { value: "messages", label: "Pesan" },
        { value: "profile", label: "Profil" },
      ]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
