<!-- @dsCard group="Components" viewport="700x320" name="Feedback" -->
<link rel="stylesheet" href="../../styles.css">
<div id="root" style="padding:24px;background:var(--neu-surface);font-family:var(--font-body)"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Badge, Tag, Tooltip, Toast, Dialog, Button, Reaction, Spinner } = window.SahariDesignSystem_9526ae;
function Demo(){
  const [sel,setSel]=React.useState("Anxiety");
  const [liked,setLiked]=React.useState(true);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:16}}>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <Badge tone="brand">Verified</Badge>
        <Badge tone="success">Online</Badge>
        <Badge tone="warning">Pending review</Badge>
        <Badge tone="danger">Escalated</Badge>
        <Badge tone="info">New</Badge>
        <Badge tone="neutral">Draft</Badge>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {["Anxiety","Relationships","Grief","Stress"].map(t=><Tag key={t} selected={sel===t} onClick={()=>setSel(t)}>{t}</Tag>)}
      </div>
      <Toast tone="success" title="Session booked" description="You'll get a reminder 1 hour before." />
      <div style={{display:"flex",gap:16,alignItems:"center"}}>
        <Tooltip label="Mark as resolved"><Button size="sm" variant="ghost">Hover me</Button></Tooltip>
        <Reaction icon={<span>♡</span>} activeIcon={<span>♥</span>} count={12} active={liked} onClick={()=>setLiked(v=>!v)} />
        <Spinner size={20} label="Memuat" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
