name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  # Required for npm trusted publishing (OIDC token exchange, no NPM_TOKEN).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck

      # pnpm publish rewrites `workspace:*` deps to the real resolved version
      # in the published tarball, and (with pnpm/npm recent enough) uses the
      # GitHub Actions OIDC token to authenticate via npm's trusted publisher
      # feature — no NPM_TOKEN secret needed once configured on npmjs.com.
      - name: Publish @sahari-ui/tokens
        run: pnpm --filter @sahari-ui/tokens publish --access public --no-git-checks --provenance

      - name: Publish @sahari-ui/react
        run: pnpm --filter @sahari-ui/react publish --access public --no-git-checks --provenance
